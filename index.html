<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SAO Stuff Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap">
<style>
:root{--bg:#e6e9ef;--bg2:#f4f5f8;--panel:#fcfcfe;--line:#c5cad6;--text:#232836;--mute:#667086;--acc:#e98200;--acc2:#2c6cb0;--bad:#d23b4a;--on:#fff;--glow:rgba(233,130,0,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070b17;--bg2:#0d1428;--panel:#111a30;--line:#2a3a63;--text:#e8eefc;--mute:#8fa0c4;--acc:#ffa51f;--acc2:#6fb4ff;--bad:#ff6677;--on:#1a1100;--glow:rgba(255,165,31,.10)}}
:root[data-theme="dark"]{--bg:#070b17;--bg2:#0d1428;--panel:#111a30;--line:#2a3a63;--text:#e8eefc;--mute:#8fa0c4;--acc:#ffa51f;--acc2:#6fb4ff;--bad:#ff6677;--on:#1a1100;--glow:rgba(255,165,31,.10)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(900px 380px at 50% -120px,var(--glow),transparent 70%),repeating-linear-gradient(60deg,transparent 0 46px,rgba(127,140,170,.06) 46px 47px),repeating-linear-gradient(-60deg,transparent 0 46px,rgba(127,140,170,.06) 46px 47px),linear-gradient(var(--bg2),var(--bg));background-attachment:fixed;min-height:100vh}
h1,h2,h3,.slot label{font-family:Rajdhani,"Segoe UI",system-ui,sans-serif}
header{max-width:1150px;margin:auto;padding:22px 20px 6px}
.logo{display:flex;align-items:center;gap:14px}
.hex{width:46px;height:52px;flex:none;background:linear-gradient(145deg,var(--acc),var(--acc2));clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);display:grid;place-items:center;color:var(--on);font:700 22px Rajdhani,sans-serif}
.hex::after{content:"⚔"}
h1{margin:0;font-size:34px;line-height:1;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
header p{margin:5px 0 0;color:var(--mute);font-size:13px;letter-spacing:.04em}
main{max-width:1150px;margin:auto;padding:14px 20px 40px;display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
@media(max-width:860px){main{grid-template-columns:1fr}}
section{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:3px 14px 3px 14px;padding:18px 18px 16px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
section::before{content:"";position:absolute;left:-1px;right:30px;top:-1px;height:3px;background:linear-gradient(90deg,var(--acc),transparent)}
.side{display:flex;flex-direction:column;gap:20px}
h2{margin:0 0 12px;font-size:20px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;display:flex;align-items:center;gap:9px}
h2::before{content:"";width:10px;height:10px;background:var(--acc);transform:rotate(45deg)}
h3{font-size:13px;margin:16px 0 6px;color:var(--acc2);font-weight:700;letter-spacing:.12em;text-transform:uppercase;border-bottom:1px solid var(--line);padding-bottom:3px}
.slot{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:9px 0 9px 10px;border-bottom:1px solid var(--line);border-left:3px solid transparent;transition:border-color .15s,background .15s}
.slot:hover,.slot:focus-within{border-left-color:var(--acc);background:linear-gradient(90deg,var(--glow),transparent 70%)}
.slot:last-child{border-bottom:0}
.slot label{color:var(--mute);font-size:14px;padding-top:7px;letter-spacing:.1em;text-transform:uppercase;font-weight:600}
select,input{font:inherit;color:var(--text);background:var(--bg2);border:1px solid var(--line);border-radius:3px;padding:7px 9px;width:100%}
select:hover,input:hover{border-color:var(--acc2)}
button{font:inherit;font-family:Rajdhani,sans-serif;font-size:15px;letter-spacing:.1em;text-transform:uppercase;cursor:pointer;background:linear-gradient(var(--acc),color-mix(in srgb,var(--acc) 80%,#000));color:var(--on);border:0;border-radius:3px 10px 3px 10px;padding:8px 16px;font-weight:700}
button.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:600}
button:hover{filter:brightness(1.08)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.meta{font-size:13px;color:var(--mute);margin-top:3px}.meta b{font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.row>*{flex:1 1 110px}.row button{flex:0 0 auto}
.chk{display:flex;align-items:center;gap:6px;font-size:14px}.chk input{width:auto;accent-color:var(--acc)}
.t-C{color:#0ABE00}.t-B{color:#4A91EF}.t-A{color:#9a3be8}.t-S{color:#d9a300}.t-Sp{color:#F13F3F}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .t-A{color:#b97cff}:root:not([data-theme="light"]) .t-S{color:#ffcc00}}
.tot{display:grid;grid-template-columns:1fr auto;gap:3px 14px;font-variant-numeric:tabular-nums}
.tot span{border-bottom:1px dotted var(--line)}.tot b{text-align:right;color:var(--acc);font-family:Rajdhani,sans-serif;font-size:17px}
.warn{color:var(--bad);font-size:13px;margin:10px 0 0}.empty{color:var(--mute)}
.dim{color:var(--mute);opacity:.7}.set{margin:8px 0 2px;font-weight:700;color:var(--acc2);font-family:Rajdhani,sans-serif;letter-spacing:.06em}.sbl{font-size:13px;margin-left:8px}
</style>
</head>
<body>
<header><div class="logo"><div class="hex" aria-hidden="true"></div><div><h1>SAO Stuff Builder</h1><p id="sub"></p></div></div></header>
<main>
<section>
<h2>Your build</h2>
<div class="row"><div><label class="meta" for="cls">Class</label><select id="cls"></select></div><div><label class="meta" for="lvl">Your level</label><input id="lvl" type="number" min="1" value="20"></div><div><label class="meta" for="ph">Phase</label><select id="ph"><option value="">All phases</option><option>P1</option><option>P2</option><option>P3</option><option>P4</option></select></div></div>
<div class="row"><div><label class="meta" for="q">Filter by name</label><input id="q" placeholder="e.g. Améthyste"></div></div>
<label class="chk"><input id="only" type="checkbox"> Only show items up to my level</label>
<div id="slots" style="margin-top:8px"></div>
<div class="row" style="margin-top:12px"><button id="clear" class="ghost">Clear build</button><button id="copy" class="ghost">Copy build as text</button></div>
<p id="msg" class="meta" role="status"></p>
</section>
<div class="side"><section><h2>Total stats</h2><div id="totals" class="tot"></div><h3>Set bonuses</h3><div id="sets"></div><p id="warns" class="warn"></p></section></div>
</main>
